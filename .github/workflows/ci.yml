name: ci
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck hooks/*/* install.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: self-test hooks
        run: |
          set -e
          mkdir -p /tmp/test-repo && cd /tmp/test-repo
          git init
          git config user.email "test@test.com"
          git config user.name "Test"

          cp -r "$GITHUB_WORKSPACE/hooks" .git/hooks/
          chmod +x .git/hooks/*/*

          # test conventional commit
          echo "bad message" | .git/hooks/commit-msg/conventional /dev/stdin 2>&1 && exit 1 || true
          echo "feat: good message" | .git/hooks/commit-msg/conventional /dev/stdin

          # test branch-name
          git checkout -b feat/test-branch
          .git/hooks/pre-push/branch-name

          git checkout -b BAD_BRANCH 2>/dev/null || true
          .git/hooks/pre-push/branch-name 2>&1 && exit 1 || true
