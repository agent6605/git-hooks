name: ci
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck hooks/*/* install.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: self-test hooks
        run: |
          set -e
          cd /tmp
          mkdir -p test-repo && cd test-repo
          git init
          git config user.email "test@test.com"
          git config user.name "Test"

          # Install hooks using the actual install script
          bash "$GITHUB_WORKSPACE/install.sh"

          # test conventional commit (via runner script)
          echo "bad message" > msg
          bash .git/hooks/commit-msg msg 2>&1 && exit 1 || true
          echo "feat(scope): good message" > msg
          bash .git/hooks/commit-msg msg

          # test branch-name (via runner script)
          git checkout -b feat/test-branch
          bash .git/hooks/pre-push

          git checkout -b BAD_BRANCH 2>/dev/null || true
          bash .git/hooks/pre-push 2>&1 && exit 1 || true

          # test secret detection
          echo "AWS_KEY=AKIA123456789EXAMPLE" > .env
          git add .env
          git commit -m "test" 2>&1 && exit 1 || true

          # test SKIP bypass
          SKIP=secret-check git commit -m "test sec" 2>&1 | tail -1

          # test large file detection
          dd if=/dev/zero of=big.bin bs=1M count=2 2>/dev/null
          git add big.bin
          git commit -m "big" 2>&1 && exit 1 || true

          echo "ALL TESTS PASSED"
